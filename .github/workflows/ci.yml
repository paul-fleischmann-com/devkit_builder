name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - run: go build ./...

      - name: Test with coverage
        shell: bash # with pipefail: a failing test fails the step despite `| tee`
        run: go test -covermode=atomic -coverprofile=coverage.out ./... | tee test.txt

      - name: Coverage report
        if: always()
        run: |
          [ -f coverage.out ] || exit 0
          go tool cover -html=coverage.out -o coverage.html
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          {
            echo "## Test coverage: ${total}"
            echo
            echo "| Package | Coverage |"
            echo "|---|---|"
            grep -E '^(ok|\?)' test.txt | awk '{
              pkg=$2; sub(/^github.com\/[^\/]+\/[^\/]+\//, "", pkg)
              c="–"
              for (i=1;i<=NF;i++) if ($i=="coverage:") c=$(i+1)
              if ($1=="?") c="no tests"
              print "| `" pkg "` | " c " |"
            }'
            echo
            echo "<details><summary>Per function</summary>"
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: |
            coverage.html
            coverage.out
          if-no-files-found: ignore
